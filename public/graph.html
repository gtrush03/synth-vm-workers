<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deal graph · SYNTH Deal Room</title>
<style>
:root{--bg:#000;--ink:#f4f2ee;--dim:#8e8e93;--faint:#3a3a3c;--acc:#ecd3a0;--red:#ff4d4f;--line:#2c2c2e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 20px 10px;z-index:2;pointer-events:none}
header h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
header .run{color:var(--acc);font-weight:600}
header .meta{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
header .kind{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--dim);color:var(--dim)}
header .kind:empty{display:none}header .kind.real{border-color:var(--acc);color:var(--acc)}
.tog{pointer-events:auto;margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.tog i{width:26px;height:15px;border-radius:999px;background:var(--faint);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .2s}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--acc)}.tog[aria-pressed="true"] i{background:var(--acc)}.tog[aria-pressed="true"] i::after{left:13px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--faint)}.live.on i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.legend{position:fixed;left:20px;bottom:16px;display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;z-index:2;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend b{display:inline-block;width:10px;height:10px;border-radius:50%}
svg{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.edge{stroke:var(--line);stroke-width:1.2}.edge.ON{stroke-dasharray:3 3}.edge.hot{stroke:var(--acc);stroke-width:2}.edge.hot.veto{stroke:var(--red)}
.node{cursor:default}.node.Claim{cursor:pointer}
.node text{fill:#d1d1d6;font-size:11px;paint-order:stroke;stroke:#000;stroke-width:3px;pointer-events:none}
.node.Claim text{fill:var(--ink);font-size:12px;font-weight:600}
.node.dim{opacity:.13}.edge.dim{opacity:.08}
aside{position:fixed;right:16px;top:64px;bottom:16px;width:min(380px,calc(100% - 32px));background:rgba(12,12,12,.94);border:1px solid var(--line);border-radius:16px;padding:18px;overflow:auto;z-index:3;display:none}
aside.on{display:block}
aside h2{font-size:12px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
aside .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer}
.ver{border-left:2px solid var(--faint);padding:2px 0 12px 14px;margin-left:4px;position:relative}
.ver::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.ver.veto::before{background:var(--red)}.ver.old{opacity:.8}
.ver .v{color:var(--dim);font-size:12px}
.ver q{display:block;font-size:16px;line-height:1.3;margin:3px 0 8px;quotes:"“" "”"}
.ev{font-size:13px;color:#d1d1d6;margin:4px 0;padding-left:10px;border-left:1px solid var(--line)}
.ev a{color:var(--acc)}.ev .who{color:var(--acc);font-weight:600}
.none{color:var(--red);font-weight:700;font-size:13px}
.dec{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:6px;margin:4px 6px 0 0;border:1px solid var(--acc);color:var(--acc)}
.dec.VETO{border-color:var(--red);color:#fff;background:var(--red)}.dec.APPROVED{background:var(--acc);color:#000}
.dec + small{color:var(--dim);font-size:12px}
.empty{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font-size:15px;text-align:center;padding:24px;pointer-events:none}
@media (max-width:700px){aside{top:auto;height:55%;right:8px;left:8px;width:auto;bottom:8px}.legend{display:none}header{padding:12px 14px}}
</style>
</head>
<body>
<header>
  <h1>Deal graph</h1>
  <span class="run" id="run"></span>
  <span class="kind" id="kind"></span>
  <span class="meta" id="meta"></span>
  <span class="live" id="live"><i></i>live</span>
  <button class="tog" id="tog" type="button" aria-pressed="false"><i></i>Show rehearsals</button>
</header>
<svg id="g" aria-label="Deal graph"></svg>
<div class="empty" id="empty">Waiting for the first real run…</div>
<div class="legend">
  <span><b style="background:#fff"></b>Transcript line</span>
  <span><b style="background:#636366"></b>Source</span>
  <span><b style="background:var(--acc)"></b>Claim</span>
  <span><b style="background:var(--red)"></b>BLOCKED</span>
  <span>Tap a claim to trace it</span>
</div>
<aside id="side" aria-live="polite"><button class="x" id="close" aria-label="Close">×</button><h2>Why this claim</h2><div id="path"></div></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/graph.js"></script>
</body>
</html>
